name: Collecte Twitch Helix

on:
  schedule:
    - cron: "17 */4 * * *"  # 00:17, 04:17, ... UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-collecte
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt et le CSV existant
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer requests
        run: python -m pip install requests

      - name: Collecter les streams
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python collecte_twitch.py

      - name: Conserver le CSV dans le dépôt privé
        run: |
          if [ -f twitch_helix_7jours.csv ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add twitch_helix_7jours.csv
            if ! git diff --cached --quiet; then
              git commit -m "Ajout du relevé Twitch"
              git push
            else
              echo "Aucune nouvelle observation"
            fi
          fi
