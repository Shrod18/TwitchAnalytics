name: Test Twitch Helix (10 minutes)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twitch-test
  cancel-in-progress: false

jobs:
  test-collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer requests
        run: python -m pip install requests

      - name: Collecter toutes les 2 minutes pendant 10 minutes
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python -u collect_twitch_test.py

      - name: Enregistrer le CSV dans le dépôt
        if: always()
        run: |
          if [ ! -f twitch_helix_test_10min.csv ]; then
            echo 'Aucun CSV disponible à enregistrer.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add twitch_helix_test_10min.csv
          if ! git diff --cached --quiet; then
            git commit -m 'test: relevés Twitch Helix sur 10 minutes'
            git push
          else
            echo 'Aucun changement à enregistrer.'
          fi
